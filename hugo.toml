baseURL = "https://francescopapaleo.net/"
title = "Francesco Papaleo"

locale = "en-us"
defaultContentLanguage = "en"

enableRobotsTXT = true
enableEmoji = true
enableGitInfo = true

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML"]
  term = ["HTML"]

[permalinks]
  projects = "/projects/:slug/"
  page = "/:slug/"

[taxonomies]
  tag = "tags"

# Work, About and Contact are sections of the homepage; Newsletter is its own section.
[menu]
  [[menu.main]]
    name = "Work"
    url = "/#work"
    weight = 1
  [[menu.main]]
    name = "About"
    url = "/#about"
    weight = 2
  [[menu.main]]
    name = "Newsletter"
    url = "/newsletter/"
    weight = 3
  [[menu.main]]
    name = "Contact"
    url = "/#contact"
    weight = 4

[params]
  description = "Sound designer and engineer working across music, immersive audio, and interactive art."
  subtitle = "Listen on the shoulders of giants"
  disciplines = "Sound design · Engineering · Music · Immersive audio"
  image = "/assets/img/avatar.png"
  since = 2020

  # Contact links, in display order (homepage Contact section and /contact/).
  [[params.links]]
    name = "Instagram"
    url = "https://www.instagram.com/francesco.papaleo.music/"
  [[params.links]]
    name = "SoundCloud"
    url = "https://soundcloud.com/francescopapaleo"
  [[params.links]]
    name = "Bandcamp"
    url = "https://francescopapaleo.bandcamp.com/"
  [[params.links]]
    name = "GitHub"
    url = "https://github.com/francescopapaleo"
  [[params.links]]
    name = "LinkedIn"
    url = "https://www.linkedin.com/in/francesco-papaleo/"

  [params.goatcounter]
    enable = true
    code = "francescopapaleo"

[markup]
  [markup.goldmark]
    [markup.goldmark.extensions]
      definitionList = true
      footnote = true
      linkify = true
      strikethrough = true
      table = true
      taskList = true
      typographer = true
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = true
    style = "bw"
