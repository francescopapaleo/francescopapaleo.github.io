{{- /* Project gallery: grid of images opening in the <dialog> lightbox (site.js).
     Usage: {{ partial "gallery.html" .Params.gallery }}
     Items: src, alt, caption, linked (default true). */ -}}
<div class="gallery">
    {{- range . }}
    {{- $alt := .alt | default .caption | default "" }}
    <figure>
        {{- if ne .linked false }}
        <a href="{{ .src | relURL }}" data-lightbox data-alt="{{ $alt }}" data-caption="{{ .caption | default "" | plainify }}">
            <img src="{{ .src | relURL }}" alt="{{ $alt }}" loading="lazy" decoding="async">
        </a>
        {{- else }}
        <img src="{{ .src | relURL }}" alt="{{ $alt }}" loading="lazy" decoding="async">
        {{- end }}
        {{- with .caption }}<figcaption>{{ . | safeHTML }}</figcaption>{{ end }}
    </figure>
    {{- end }}
</div>
<dialog class="lightbox" id="lightbox" aria-label="Image viewer">
    <form method="dialog"><button class="label" type="submit">Close</button></form>
    <img src="data:," alt="">
    <p hidden></p>
</dialog>
