{{- define "main" }}
<section class="page">
    <header class="page__head">
        <h1 class="page__title">{{ .Title }}</h1>
        {{- with .Description }}<p class="page__lede">{{ . }}</p>{{ end }}
    </header>
    {{- with .Content }}<div class="prose">{{ . }}</div>{{ end }}
    <ol class="issues">
        {{- range .Pages.ByDate.Reverse }}
        <li>
            <time class="label" datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006" }}</time>
            <a href="{{ .RelPermalink }}">{{ .Title }}</a>
            {{- with .Description }}<p>{{ . }}</p>{{ end }}
        </li>
        {{- end }}
    </ol>
</section>
{{- end }}
