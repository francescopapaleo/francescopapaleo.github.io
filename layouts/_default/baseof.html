<!doctype html>
<html lang="{{ site.Language.Locale | default "en" }}">
<head>
    {{- partial "head.html" . }}
</head>
<body>
    <div class="wrap">
        {{- partial "header.html" . }}
        <main id="main">
            {{- block "main" . }}{{ end }}
        </main>
        {{- partial "footer.html" . }}
    </div>
    {{- block "after" . }}{{ end }}
    {{- with resources.Get "js/site.js" | minify | fingerprint }}
    <script src="{{ .RelPermalink }}" integrity="{{ .Data.Integrity }}" defer></script>
    {{- end }}
</body>
</html>
